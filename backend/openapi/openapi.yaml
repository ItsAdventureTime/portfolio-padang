openapi: 3.1.0
info:
  title: Padang ERP Lite API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/request-otp:
    post:
      operationId: requestOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202': { description: OTP request accepted }
        '429': { description: Rate limited }
  /api/v1/auth/verify-otp:
    post:
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid OTP }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses:
        '200': { description: Refreshed }
        '401': { description: Invalid refresh token }
  /api/v1/dashboard/summary:
    get:
      operationId: dashboardSummary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard summary }
        '401': { description: Authentication required }
  /api/v1/projects:
    get:
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Project list }
    post:
      operationId: createProject
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Project created }
        '400': { description: Invalid project }
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Project detail }
        '404': { description: Project not found }
    put:
      operationId: updateProject
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Project updated }
  /api/v1/fabrication:
    get:
      operationId: listFabricationJobs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fabrication job list }
    post:
      operationId: createFabricationJob
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Fabrication job created }
  /api/v1/fabrication/{id}/status:
    patch:
      operationId: updateFabricationStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fabrication status updated }
  /api/v1/procurement/purchase-requests:
    get:
      operationId: listPurchaseRequests
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Purchase request list }
    post:
      operationId: createPurchaseRequest
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Purchase request created }
  /api/v1/procurement/purchase-orders:
    get:
      operationId: listPurchaseOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Purchase order list }
  /api/v1/procurement/fund-requests:
    get:
      operationId: listFundRequests
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Fund request list }
    post:
      operationId: createFundRequest
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Fund request created }
  /api/v1/inventory/items:
    get:
      operationId: listInventoryItems
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Inventory item list }
    post:
      operationId: createInventoryItem
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Inventory item created }
  /api/v1/inventory/stock-in:
    post:
      operationId: stockIn
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Stock received }
  /api/v1/inventory/stock-out:
    post:
      operationId: stockOut
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Stock issued }
  /api/v1/billing/progress:
    get:
      operationId: listProgressBillings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Progress billing list }
    post:
      operationId: createProgressBilling
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Progress billing created }
  /api/v1/finance/reimbursements:
    get:
      operationId: listReimbursements
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reimbursement list }
  /api/v1/finance/liquidations:
    get:
      operationId: listLiquidations
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Liquidation list }
  /api/v1/attachments/presign:
    post:
      operationId: presignAttachment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentPresignRequest'
      responses:
        '200':
          description: B2 upload URL and persisted attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentPresignResponse'
        '400': { description: Invalid attachment metadata }
        '403': { description: Insufficient role or ownership }
        '404': { description: Entity not found or not owned }
        '503': { description: Attachment storage unavailable }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, environment]
      properties:
        status: { type: string }
        environment: { type: string, enum: [demo, production] }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    VerifyOTPRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
    AttachmentPresignRequest:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id, file_name, content_type, size]
      properties:
        entity_type:
          type: string
          enum: [project, fabrication_job, purchase_request, purchase_order, fund_request, progress_billing, fabrication_billing, collection, client, supplier, reimbursement, liquidation]
        entity_id: { type: string, format: uuid }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        content_type:
          type: string
          enum: [application/pdf, application/acad, application/vnd.autocad.dwg, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png, image/webp, text/plain, text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        size: { type: integer, format: int64, minimum: 1, maximum: 52428800 }
        category:
          type: string
          enum: [contract, drawing, permit, photo, report, receipt, other]
    AttachmentPresignResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [attachment_id, storage_key, upload_url, method]
          properties:
            attachment_id: { type: string, format: uuid }
            storage_key: { type: string }
            upload_url: { type: string, format: uri }
            method: { type: string, enum: [PUT] }
        meta:
          type: object
          properties:
            request_id: { type: string }
