name: padang-demo

services:
  db:
    image: docker.io/library/postgres:alpine
    environment:
      POSTGRES_DB: padang_demo
      POSTGRES_USER: padang_demo_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      PGDATA: /var/lib/postgresql/data
    secrets: [db-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [padang-network]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: [migrate]
    image: docker.io/migrate/migrate:latest
    depends_on:
      db:
        condition: service_healthy
    secrets: [db-password]
    volumes: [./migrations:/migrations:ro]
    networks: [padang-network]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        exec migrate -path /migrations \
          -database "postgres://padang_demo_user:$$(cat /run/secrets/db-password)@db:5432/padang_demo?sslmode=disable" \
          up
    restart: "no"

  api:
    image: padang-demo-api:manual
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: demo
      RUN_MODE: api
      HTTP_ADDR: :8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: padang_demo
      DB_USER: padang_demo_user
      EMAIL_PROVIDER: log
      EMAIL_FROM: Padang ERP <noreply@example.invalid>
    secrets: [db-password]
    networks: [padang-network]
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    image: padang-demo-frontend:manual
    pull_policy: never
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks: [padang-network]
    restart: unless-stopped

  gateway:
    image: docker.io/library/nginx:alpine
    depends_on:
      frontend:
        condition: service_started
    volumes: [./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro]
    networks:
      padang-network: {}
      cloudflared-network:
        aliases: [padang-demo-gateway]
    restart: unless-stopped

  demo-seed:
    profiles: [demo-seed]
    image: docker.io/library/postgres:alpine
    depends_on:
      db:
        condition: service_healthy
    secrets: [db-password]
    volumes: [./seed:/seed:ro]
    networks: [padang-network]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/db-password)"
        test "$$(psql -h db -U padang_demo_user -d padang_demo -Atqc 'select current_database()')" = padang_demo
        exec psql --single-transaction -v ON_ERROR_STOP=1 -h db -U padang_demo_user -d padang_demo -f /seed/demo_seed.sql
    restart: "no"

volumes:
  postgres-data:

networks:
  padang-network:
    internal: true
  cloudflared-network:
    external: true
    name: cloudflared-network

secrets:
  db-password:
    file: ./secrets/db-password
